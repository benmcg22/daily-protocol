<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Daily Protocol & Habit Tracker</title>
  <!-- Tailwind CSS -->
  <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            darkbg: '#070a12',
            cardbg: '#0f172a',
            cardborder: '#1e293b',
          }
        }
      }
    }
  </script>
  <!-- Google Font: Inter -->
  <link rel="stylesheet" href="[https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap](https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap)">
  <!-- Lucide Icons -->
  <script src="[https://unpkg.com/lucide@latest](https://unpkg.com/lucide@latest)"></script>
  <!-- Chart.js -->
  <script src="[https://cdn.jsdelivr.net/npm/chart.js](https://cdn.jsdelivr.net/npm/chart.js)"></script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #070a12;
      color: #f8fafc;
      -webkit-tap-highlight-color: transparent;
    }
    input[type="date"]::-webkit-calendar-picker-indicator {
      filter: invert(1);
    }
    .progress-ring-circle {
      transition: stroke-dashoffset 0.5s ease-in-out;
      transform: rotate(-90deg);
      transform-origin: 50% 50%;
    }
  </style>
</head>
<body class="min-h-screen bg-[#070a12] text-slate-100 flex flex-col selection:bg-emerald-500 selection:text-white">

  <!-- Tactical Header -->
  <header class="border-b border-slate-800 bg-[#0f172a]/90 backdrop-blur-md sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-4 py-3.5 flex items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-emerald-500 to-teal-700 flex items-center justify-center text-white shadow-lg shadow-emerald-500/20 font-black text-lg">
          DP
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="text-base font-extrabold tracking-wide uppercase text-white">Daily Protocol</h1>
            <span class="text-[10px] font-mono font-bold px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/30">12 ITEMS</span>
          </div>
          <p class="text-[11px] text-slate-400 font-medium">Non-Negotiable Habit & Supplement Tracker</p>
        </div>
      </div>

      <!-- Actions -->
      <div class="flex items-center gap-2">
        <button id="btn-edit-habits" title="Edit Protocol List" class="p-2.5 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-slate-300 hover:text-white border border-slate-700/60 transition flex items-center gap-1.5 text-xs font-bold">
          <i data-lucide="sliders" class="w-4 h-4 text-emerald-400"></i>
          <span class="hidden sm:inline">Customize</span>
        </button>
        <button id="btn-export" title="Export Backup" class="p-2.5 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-slate-300 hover:text-white border border-slate-700/60 transition" aria-label="Export">
          <i data-lucide="download" class="w-4 h-4"></i>
        </button>
        <label title="Import Backup" class="p-2.5 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-slate-300 hover:text-white border border-slate-700/60 transition cursor-pointer" aria-label="Import">
          <i data-lucide="upload" class="w-4 h-4"></i>
          <input type="file" id="input-import" accept=".json" class="hidden">
        </label>
      </div>
    </div>
  </header>

  <!-- Toast Notification -->
  <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none max-w-sm w-full px-4"></div>

  <!-- Main Content Layout -->
  <main class="flex-grow max-w-6xl w-full mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-12 gap-6">

    <!-- Left Column: Daily Checklist & Date Selector (7 cols) -->
    <div class="lg:col-span-7 space-y-6">

      <!-- Date Navigation Banner -->
      <div class="bg-[#0f172a] border border-slate-800 rounded-2xl p-4 shadow-xl flex flex-col sm:flex-row items-center justify-between gap-4">
        <div class="flex items-center gap-3 w-full sm:w-auto">
          <button id="btn-prev-day" class="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 transition" aria-label="Previous Day">
            <i data-lucide="chevron-left" class="w-4 h-4"></i>
          </button>
          <div class="flex-grow sm:flex-grow-0">
            <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-0.5">Logging Date</label>
            <input type="date" id="date-picker" class="w-full sm:w-auto bg-[#070a12] border border-emerald-500/40 focus:border-emerald-500 rounded-xl px-3 py-1.5 text-sm font-semibold text-white focus:outline-none">
          </div>
          <button id="btn-next-day" class="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 transition" aria-label="Next Day">
            <i data-lucide="chevron-right" class="w-4 h-4"></i>
          </button>
        </div>
        <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
          <button id="btn-today" class="px-3 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-bold text-slate-300 transition">Today</button>
          <button id="btn-mark-all" class="px-3.5 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-xs font-extrabold uppercase tracking-wider text-white shadow-lg shadow-emerald-600/20 transition flex items-center gap-1.5">
            <i data-lucide="check-check" class="w-4 h-4"></i> Complete All
          </button>
        </div>
      </div>

      <!-- Consecutive Miss Alert Banner (Hidden by default) -->
      <div id="miss-alert-banner" class="hidden bg-rose-950/40 border border-rose-500/50 rounded-2xl p-4 text-rose-200 shadow-xl flex items-start gap-3">
        <div class="p-2 rounded-xl bg-rose-500/20 text-rose-400 shrink-0">
          <i data-lucide="alert-triangle" class="w-5 h-5"></i>
        </div>
        <div>
          <h4 class="text-xs font-extrabold uppercase tracking-wider text-rose-300">Protocol Breach Warning</h4>
          <p id="miss-alert-text" class="text-xs text-rose-200/90 mt-0.5 leading-relaxed"></p>
        </div>
      </div>

      <!-- Habit Checklist Categorized Container -->
      <div id="habit-checklist-container" class="space-y-6">
        <!-- Rendered dynamically -->
      </div>

    </div>

    <!-- Right Column: Progress Telemetry & History (5 cols) -->
    <div class="lg:col-span-5 space-y-6">

      <!-- Progress Scorecard -->
      <div class="bg-[#0f172a] border border-slate-800 rounded-2xl p-5 shadow-xl space-y-5">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-4">
            <div class="relative w-20 h-20 shrink-0">
              <svg class="w-20 h-20" viewBox="0 0 84 84">
                <circle cx="42" cy="42" r="35" stroke="#1e293b" stroke-width="7" fill="transparent" />
                <circle id="daily-progress-ring" class="progress-ring-circle" cx="42" cy="42" r="35" stroke="#10b981" stroke-width="7" stroke-linecap="round" fill="transparent" stroke-dasharray="219.91" stroke-dashoffset="219.91" />
              </svg>
              <div class="absolute inset-0 flex flex-col items-center justify-center">
                <span id="daily-pct-text" class="text-base font-black text-white">0%</span>
              </div>
            </div>
            <div>
              <div class="text-[10px] font-bold uppercase tracking-widest text-slate-400">Daily Execution</div>
              <div id="daily-fraction-text" class="text-2xl font-black text-white mt-0.5">0 <span class="text-sm font-normal text-slate-400">/ 12</span></div>
              <div id="daily-grade-badge" class="inline-block mt-1 px-2.5 py-0.5 rounded-full text-[10px] font-extrabold uppercase tracking-wider bg-slate-800 text-slate-400">
                Pending
              </div>
            </div>
          </div>
        </div>

        <!-- Linear Progress Bar -->
        <div class="w-full bg-slate-800 h-2.5 rounded-full overflow-hidden">
          <div id="daily-progress-bar" class="bg-gradient-to-r from-emerald-500 to-teal-400 h-full w-0 transition-all duration-500"></div>
        </div>
      </div>

      <!-- 14-Day Consistency Matrix -->
      <div class="bg-[#0f172a] border border-slate-800 rounded-2xl p-5 shadow-xl space-y-3">
        <div class="flex items-center justify-between border-b border-slate-800 pb-3">
          <h3 class="text-xs font-bold uppercase tracking-wider text-emerald-400 flex items-center gap-2">
            <i data-lucide="grid" class="w-4 h-4"></i> 14-Day Consistency Matrix
          </h3>
          <span class="text-[10px] font-mono text-slate-400">Recent History</span>
        </div>
        <div id="consistency-matrix-grid" class="grid grid-cols-7 gap-2 pt-1">
          <!-- Rendered dynamically -->
        </div>
      </div>

      <!-- Trend Chart -->
      <div class="bg-[#0f172a] border border-slate-800 rounded-2xl p-5 shadow-xl space-y-3">
        <div class="flex items-center justify-between border-b border-slate-800 pb-3">
          <h3 class="text-xs font-bold uppercase tracking-wider text-emerald-400 flex items-center gap-2">
            <i data-lucide="trending-up" class="w-4 h-4"></i> Completion Trend
          </h3>
          <span class="text-[10px] font-mono text-slate-400">Last 14 Days</span>
        </div>
        <div class="h-44 w-full relative">
          <canvas id="habitTrendChart"></canvas>
        </div>
      </div>

    </div>

  </main>

  <!-- Customization Modal -->
  <div id="habit-editor-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden items-center justify-center p-4">
    <div class="bg-[#0f172a] border border-slate-800 rounded-2xl max-w-lg w-full max-h-[85vh] flex flex-col shadow-2xl overflow-hidden">
      <div class="p-5 border-b border-slate-800 flex items-center justify-between">
        <h3 class="text-sm font-extrabold uppercase tracking-wide text-white">Customize Protocol Habits</h3>
        <button id="close-habit-editor" class="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>
      <div id="habit-editor-list" class="p-5 overflow-y-auto space-y-3 flex-grow">
        <!-- Rendered dynamically -->
      </div>
      <div class="p-4 border-t border-slate-800 bg-[#070a12] flex justify-between items-center">
        <button id="btn-restore-defaults" class="text-xs font-bold text-slate-400 hover:text-emerald-400 transition">Restore 12 Defaults</button>
        <button id="btn-close-modal" class="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-xs font-bold text-white transition">Done</button>
      </div>
    </div>
  </div>

  <!-- Script Logic -->
  <script>
    lucide.createIcons();

    const STORAGE_KEY = 'daily_protocol_habits_v2';
    const HABITS_DEF_KEY = 'daily_protocol_defs_v2';

    const DEFAULT_HABITS = [
      { id: 'walk_20', label: 'Walk 20 mins', category: 'Movement & Training', badge: '20 MIN' },
      { id: 'workout_30', label: 'Workout 30 mins', category: 'Movement & Training', badge: '30 MIN' },
      { id: 'mobility', label: 'Mobility', category: 'Movement & Training', badge: 'RECOVERY' },
      { id: 'forearms_5', label: '5 minute forearms', category: 'Movement & Training', badge: '5 MIN' },
      { id: 'im8', label: 'IM8', category: 'Supplements & Stack', badge: 'DAILY' },
      { id: 'tudca', label: 'TUDCA', category: 'Supplements & Stack', badge: 'LIVER' },
      { id: 'magnesium', label: 'Magnesium', category: 'Supplements & Stack', badge: 'MINERAL' },
      { id: 'perfect_aminos', label: 'Perfect Aminos', category: 'Supplements & Stack', badge: 'EAA' },
      { id: 'rho_stack', label: 'Rho Stack', category: 'Supplements & Stack', badge: 'STACK' },
      { id: 'breakfast', label: 'Breakfast', category: 'Nutrition', badge: 'MEAL 1' },
      { id: 'lunch', label: 'Lunch', category: 'Nutrition', badge: 'MEAL 2' },
      { id: 'dinner', label: 'Dinner', category: 'Nutrition', badge: 'MEAL 3' }
    ];

    let HABITS = [];
    let cachedLogs = {};
    let selectedDate = '';
    let trendChartInstance = null;

    function getTodayISO() {
      const now = new Date();
      return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
    }

    function shiftDateISO(isoStr, delta) {
      const [y, m, d] = isoStr.split('-').map(Number);
      const dt = new Date(y, m - 1, d + delta);
      return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
    }

    function loadHabits() {
      try {
        const raw = localStorage.getItem(HABITS_DEF_KEY);
        if (raw) return JSON.parse(raw);
      } catch (e) {}
      return JSON.parse(JSON.stringify(DEFAULT_HABITS));
    }

    function saveHabits(habits) {
      HABITS = habits;
      localStorage.setItem(HABITS_DEF_KEY, JSON.stringify(habits));
    }

    function loadLogs() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return JSON.parse(raw);
      } catch (e) {}
      return {};
    }

    function saveLogs(logs) {
      cachedLogs = logs;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(logs));
    }

    function showToast(msg) {
      const c = document.getElementById('toast-container');
      const t = document.createElement('div');
      t.className = 'bg-emerald-600 text-white px-4 py-3 rounded-xl text-xs font-bold shadow-xl border border-emerald-500 flex items-center gap-2 animate-bounce';
      t.innerHTML = `<i data-lucide="check-circle" class="w-4 h-4"></i> <span>${msg}</span>`;
      c.appendChild(t);
      lucide.createIcons();
      setTimeout(() => t.remove(), 3000);
    }

    function renderAll() {
      cachedLogs = loadLogs();
      if (!selectedDate) selectedDate = getTodayISO();

      document.getElementById('date-picker').value = selectedDate;
      const dayLogs = cachedLogs[selectedDate] || {};

      const container = document.getElementById('habit-checklist-container');
      container.innerHTML = '';

      const categories = ['Movement & Training', 'Supplements & Stack', 'Nutrition'];
      const catIcons = { 'Movement & Training': 'flame', 'Supplements & Stack': 'pill', 'Nutrition': 'utensils' };
      const catColors = { 'Movement & Training': 'text-emerald-400', 'Supplements & Stack': 'text-cyan-400', 'Nutrition': 'text-amber-400' };

      let totalDone = 0;
      const totalCount = HABITS.length;

      categories.forEach(cat => {
        const catHabits = HABITS.filter(h => h.category === cat);
        if (catHabits.length === 0) return;

        const section = document.createElement('div');
        section.className = 'bg-[#0f172a] border border-slate-800 rounded-2xl p-4 shadow-xl space-y-3';
        section.innerHTML = `
          <div class="flex items-center gap-2 border-b border-slate-800 pb-2.5">
            <i data-lucide="${catIcons[cat]}" class="w-4 h-4 ${catColors[cat]}"></i>
            <h3 class="text-xs font-extrabold uppercase tracking-wider text-slate-200">${cat}</h3>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5" id="cat-grid-${cat.replace(/\s+/g, '-')}"></div>
        `;
        container.appendChild(section);

        const grid = section.querySelector(`#cat-grid-${cat.replace(/\s+/g, '-')}`);
        catHabits.forEach(h => {
          const isChecked = !!dayLogs[h.id];
          if (isChecked) totalDone++;

          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = `w-full text-left p-3 rounded-xl border transition flex items-center justify-between gap-3 ${isChecked ? 'bg-emerald-950/30 border-emerald-500/50 text-white shadow-lg shadow-emerald-950/20' : 'bg-[#070a12] border-slate-800/80 hover:border-slate-700 text-slate-300'}`;
          btn.innerHTML = `
            <div class="flex items-center gap-2.5 min-w-0">
              <div class="w-5 h-5 rounded-lg border flex items-center justify-center shrink-0 transition ${isChecked ? 'bg-emerald-500 border-emerald-400 text-white' : 'border-slate-700 bg-slate-900'}" style="color:${isChecked?'#fff':'transparent'}">
                <i data-lucide="check" class="w-3.5 h-3.5 stroke-[3]"></i>
              </div>
              <span class="text-xs font-bold truncate ${isChecked ? 'text-white' : 'text-slate-300'}">${h.label}</span>
            </div>
            <span class="text-[9px] font-mono px-1.5 py-0.5 rounded uppercase tracking-wider ${isChecked ? 'bg-emerald-500/20 text-emerald-300' : 'bg-slate-800 text-slate-400'}">${h.badge}</span>
          `;
          btn.addEventListener('click', () => {
            if (!cachedLogs[selectedDate]) cachedLogs[selectedDate] = {};
            cachedLogs[selectedDate][h.id] = !isChecked;
            saveLogs(cachedLogs);
            renderAll();
          });
          grid.appendChild(btn);
        });
      });

      const pct = Math.round((totalDone / totalCount) * 100);
      const circumference = 2 * Math.PI * 35;
      const offset = circumference - (pct / 100) * circumference;
      document.getElementById('daily-progress-ring').style.strokeDashoffset = offset;
      document.getElementById('daily-pct-text').textContent = `${pct}%`;
      document.getElementById('daily-fraction-text').innerHTML = `${totalDone} <span class="text-sm font-normal text-slate-400">/ ${totalCount}</span>`;
      document.getElementById('daily-progress-bar').style.width = `${pct}%`;

      const gradeBadge = document.getElementById('daily-grade-badge');
      if (pct === 100) {
        gradeBadge.textContent = 'PERFECT';
        gradeBadge.className = 'inline-block mt-1 px-2.5 py-0.5 rounded-full text-[10px] font-extrabold uppercase tracking-wider bg-emerald-500/20 text-emerald-400 border border-emerald-500/4
