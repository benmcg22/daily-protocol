<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Daily Protocol & Habit Tracker</title>
  <!-- Google Font: Inter -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-base: #070a12;
      --bg-card: #0f172a;
      --border-color: #1e293b;
      --emerald: #10b981;
      --emerald-dark: #065f46;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-base);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-tap-highlight-color: transparent;
    }
    header {
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 40;
    }
    .header-container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo-area { display: flex; align-items: center; gap: 12px; }
    .logo-badge {
      width: 40px; height: 40px;
      background: linear-gradient(135deg, #10b981, #047857);
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: 16px; color: #fff;
      box-shadow: 0 10px 15px -3px rgba(16, 185, 129, 0.2);
    }
    .title-area h1 { font-size: 16px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; }
    .title-area p { font-size: 11px; color: var(--text-muted); font-weight: 500; margin-top: 2px; }
    .actions { display: flex; align-items: center; gap: 8px; }
    .btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: var(--text-main);
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex; align-items: center; gap: 6px;
      transition: all 0.2s;
    }
    .btn:hover { background: #334155; border-color: #475569; }
    .btn-primary {
      background: #059669;
      border-color: #10b981;
      color: #fff;
    }
    .btn-primary:hover { background: #10b981; }
    
    main {
      max-width: 1100px;
      width: 100%;
      margin: 0 auto;
      padding: 24px 20px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
    }
    @media (min-width: 1024px) {
      main { grid-template-columns: 7fr 5fr; }
    }
    
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 20px 25px -5px rgba(0, 0.0, 0.0, 0.3);
    }
    
    /* Date Nav */
    .date-nav {
      display: flex; flex-direction: column; gap: 12px;
    }
    @media (min-width: 640px) {
      .date-nav { flex-direction: row; align-items: center; justify-content: space-between; }
    }
    .date-controls { display: flex; align-items: center; gap: 10px; }
    input[type="date"] {
      background: var(--bg-base);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #fff;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      outline: none;
    }
    input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); }

    /* Alert */
    .alert-banner {
      background: rgba(127, 29, 29, 0.3);
      border: 1px solid rgba(239, 68, 68, 0.4);
      border-radius: 16px;
      padding: 16px;
      display: flex; gap: 12px; align-items: flex-start;
      color: #fca5a5;
    }
    .alert-banner.hidden { display: none; }
    .alert-banner h4 { font-size: 12px; font-weight: 800; text-transform: uppercase; color: #f87171; }
    .alert-banner p { font-size: 12px; margin-top: 2px; line-height: 1.4; }

    /* Checklist Section */
    .category-section {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 20px;
    }
    .category-header {
      display: flex; align-items: center; gap: 8px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
      margin-bottom: 14px;
      font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em;
    }
    .habits-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }
    @media (min-width: 640px) {
      .habits-grid { grid-template-columns: repeat(2, 1fr); }
    }
    .habit-btn {
      width: 100%;
      text-align: left;
      background: var(--bg-base);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 12px 14px;
      display: flex; align-items: center; justify-content: space-between;
      cursor: pointer;
      transition: all 0.2s;
    }
    .habit-btn:hover { border-color: #475569; }
    .habit-btn.checked {
      background: rgba(6, 95, 70, 0.25);
      border-color: rgba(16, 185, 129, 0.5);
      box-shadow: 0 10px 15px -3px rgba(6, 95, 70, 0.2);
    }
    .habit-info { display: flex; align-items: center; gap: 10px; overflow: hidden; }
    .checkbox-box {
      width: 22px; height: 22px;
      border-radius: 6px;
      border: 2px solid #475569;
      background: #020617;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      color: transparent;
      transition: all 0.2s;
    }
    .habit-btn.checked .checkbox-box {
      background: var(--emerald);
      border-color: var(--emerald);
      color: #fff;
    }
    .habit-label { font-size: 12px; font-weight: 700; color: #cbd5e1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .habit-btn.checked .habit-label { color: #fff; }
    .habit-badge {
      font-size: 9px;
      font-family: monospace;
      padding: 3px 6px;
      border-radius: 6px;
      text-transform: uppercase;
      background: #1e293b;
      color: var(--text-muted);
      flex-shrink: 0;
    }
    .habit-btn.checked .habit-badge {
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
    }

    /* Scorecard */
    .scorecard { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .ring-container { position: relative; width: 80px; height: 80px; flex-shrink: 0; }
    .ring-container svg { width: 80px; height: 80px; transform: rotate(-90deg); }
    .ring-bg { stroke: var(--border-color); fill: none; stroke-width: 7; }
    .ring-fill { stroke: var(--emerald); fill: none; stroke-width: 7; stroke-linecap: round; stroke-dasharray: 219.91; transition: stroke-dashoffset 0.5s ease; }
    .ring-text { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 900; }
    
    .progress-bar-container { background: var(--border-color); height: 10px; border-radius: 5px; overflow: hidden; }
    .progress-bar-fill { background: linear-gradient(90deg, #10b981, #2dd4bf); height: 100%; width: 0%; transition: width 0.5s ease; }

    /* Matrix */
    .matrix-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin-top: 12px; }
    .matrix-cell {
      aspect-ratio: 1;
      border-radius: 10px;
      background: #1e293b;
      border: 1px solid rgba(255,255,255,0.05);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .matrix-cell:hover { opacity: 0.8; }
    .matrix-cell.lvl-0 { background: #1e293b; }
    .matrix-cell.lvl-1 { background: rgba(217, 119, 6, 0.6); }
    .matrix-cell.lvl-2 { background: rgba(5, 150, 105, 0.7); }
    .matrix-cell.lvl-3 { background: #10b981; }
    .matrix-date { font-size: 9px; font-family: monospace; font-weight: 700; color: #fff; }
    .matrix-count { font-size: 10px; font-weight: 900; color: #fff; }

    /* Modal */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px);
      display: none; align-items: center; justify-content: center; z-index: 100; padding: 16px;
    }
    .modal-overlay.active { display: flex; }
    .modal-content {
      background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px;
      max-width: 500px; width: 100%; max-height: 85vh; display: flex; flex-direction: column; overflow: hidden;
    }
    .modal-header { padding: 16px 20px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; font-weight: 800; text-transform: uppercase; font-size: 13px; }
    .modal-body { padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; flex-grow: 1; }
    .modal-footer { padding: 16px 20px; border-top: 1px solid var(--border-color); background: var(--bg-base); display: flex; align-items: center; justify-content: space-between; }
    
    .toast {
      position: fixed; bottom: 20px; right: 20px; z-index: 200;
      background: #059669; color: #fff; padding: 12px 18px; border-radius: 12px;
      font-size: 12px; font-weight: 700; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      display: flex; align-items: center; gap: 8px; animation: bounce 0.4s ease;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-container">
      <div class="logo-area">
        <div class="logo-badge">DP</div>
        <div class="title-area">
          <h1>Daily Protocol</h1>
          <p>Non-Negotiable Habit & Supplement Tracker</p>
        </div>
      </div>
      <div class="actions">
        <button id="btn-edit-habits" class="btn"><i data-lucide="sliders" style="width:14px;height:14px;color:#10b981;"></i> Customize</button>
        <button id="btn-export" class="btn" title="Export JSON"><i data-lucide="download" style="width:14px;height:14px;"></i></button>
        <label class="btn" style="cursor:pointer;" title="Import JSON">
          <i data-lucide="upload" style="width:14px;height:14px;"></i>
          <input type="file" id="input-import" accept=".json" style="display:none;">
        </label>
      </div>
    </div>
  </header>

  <div id="toast-container"></div>

  <main>
    <!-- Left Column -->
    <div style="display: flex; flex-direction: column; gap: 20px;">
      
      <!-- Date Banner -->
      <div class="card date-nav">
        <div class="date-controls">
          <button id="btn-prev-day" class="btn"><i data-lucide="chevron-left" style="width:16px;height:16px;"></i></button>
          <div>
            <span style="display:block; font-size:9px; font-weight:800; text-transform:uppercase; color:var(--text-muted); margin-bottom:2px;">Logging Date</span>
            <input type="date" id="date-picker">
          </div>
          <button id="btn-next-day" class="btn"><i data-lucide="chevron-right" style="width:16px;height:16px;"></i></button>
        </div>
        <div style="display: flex; gap: 8px;">
          <button id="btn-today" class="btn">Today</button>
          <button id="btn-mark-all" class="btn btn-primary"><i data-lucide="check-check" style="width:14px;height:14px;"></i> Complete All</button>
        </div>
      </div>

      <!-- Warning Banner -->
      <div id="miss-alert-banner" class="alert-banner hidden">
        <i data-lucide="alert-triangle" style="width:20px;height:20px;flex-shrink:0;"></i>
        <div>
          <h4>Protocol Breach Warning</h4>
          <p id="miss-alert-text"></p>
        </div>
      </div>

      <!-- Checklist Container -->
      <div id="habit-checklist-container"></div>
    </div>

    <!-- Right Column -->
    <div style="display: flex; flex-direction: column; gap: 20px;">
      
      <!-- Scorecard -->
      <div class="card">
        <div class="scorecard">
          <div style="display: flex; align-items: center; gap: 16px;">
            <div class="ring-container">
              <svg viewBox="0 0 84 84">
                <circle class="ring-bg" cx="42" cy="42" r="35"></circle>
                <circle id="daily-progress-ring" class="ring-fill" cx="42" cy="42" r="35" stroke-dashoffset="219.91"></circle>
              </svg>
              <div id="daily-pct-text" class="ring-text">0%</div>
            </div>
            <div>
              <div style="font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:0.05em; color:var(--text-muted);">Daily Execution</div>
              <div id="daily-fraction-text" style="font-size:24px; font-weight:900; margin-top:2px;">0 <span style="font-size:13px; font-weight:normal; color:var(--text-muted);">/ 12</span></div>
              <div id="daily-grade-badge" style="margin-top:4px; display:inline-block; padding:3px 8px; border-radius:20px; font-size:9px; font-weight:800; text-transform:uppercase; background:#1e293b; color:var(--text-muted);">Pending</div>
            </div>
          </div>
        </div>
        <div class="progress-bar-container">
          <div id="daily-progress-bar" class="progress-bar-fill"></div>
        </div>
      </div>

      <!-- Consistency Matrix -->
      <div class="card">
        <div style="display:flex; align-items:center; justify-content:between; border-bottom:1px solid var(--border-color); padding-bottom:10px; margin-bottom:10px;">
          <h3 style="font-size:12px; font-weight:800; text-transform:uppercase; color:var(--emerald); display:flex; align-items:center; gap:6px;">
            <i data-lucide="grid" style="width:14px;height:14px;"></i> 14-Day Consistency Matrix
          </h3>
          <span style="font-size:9px; font-family:monospace; color:var(--text-muted);">Recent History</span>
        </div>
        <div id="consistency-matrix-grid" class="matrix-grid"></div>
      </div>

      <!-- Trend Chart -->
      <div class="card">
        <div style="display:flex; align-items:center; justify-content:between; border-bottom:1px solid var(--border-color); padding-bottom:10px; margin-bottom:10px;">
          <h3 style="font-size:12px; font-weight:800; text-transform:uppercase; color:var(--emerald); display:flex; align-items:center; gap:6px;">
            <i data-lucide="trending-up" style="width:14px;height:14px;"></i> Completion Trend
          </h3>
          <span style="font-size:9px; font-family:monospace; color:var(--text-muted);">Last 14 Days</span>
        </div>
        <div style="height:160px; position:relative;">
          <canvas id="habitTrendChart"></canvas>
        </div>
      </div>

    </div>
  </main>

  <!-- Modal -->
  <div id="habit-editor-modal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <span>Customize Protocol Habits</span>
        <button id="close-habit-editor" class="btn"><i data-lucide="x" style="width:14px;height:14px;"></i></button>
      </div>
      <div id="habit-editor-list" class="modal-body"></div>
      <div class="modal-footer">
        <button id="btn-restore-defaults" class="btn" style="background:transparent; border:none; color:var(--text-muted);">Restore 12 Defaults</button>
        <button id="btn-close-modal" class="btn btn-primary">Done</button>
      </div>
    </div>
  </div>

  <script>
    lucide.createIcons();

    const STORAGE_KEY = 'daily_protocol_habits_v3';
    const HABITS_DEF_KEY = 'daily_protocol_defs_v3';

    const DEFAULT_HABITS = [
      { id: 'walk_20', label: 'Walk 20 mins', category: 'Movement & Training', badge: '20 MIN' },
      { id: 'workout_30', label: 'Workout 30 mins', category: 'Movement & Training', badge: '30 MIN' },
      { id: 'mobility', label: 'Mobility', category: 'Movement & Training', badge: 'RECOVERY' },
      { id: 'forearms_5', label: '5 minute forearms', category: 'Movement & Training', badge: '5 MIN' },
      { id: 'im8', label: 'IM8', category: 'Supplements & Stack', badge: 'DAILY' },
      { id: 'tudca', label: 'TUDCA', category: 'Supplements & Stack', badge: 'LIVER' },
      { id: 'magnesium', label: 'Magnesium', category: 'Supplements & Stack', badge: 'MINERAL' },
      { id: 'perfect_aminos', label: 'Perfect Aminos', category: 'Supplements & Stack', badge: 'EAA' },
      { id: 'rho_stack', label: 'Rho Stack', category: 'Supplements & Stack', badge: 'STACK' },
      { id: 'breakfast', label: 'Breakfast', category: 'Nutrition', badge: 'MEAL 1' },
      { id: 'lunch', label: 'Lunch', category: 'Nutrition', badge: 'MEAL 2' },
      { id: 'dinner', label: 'Dinner', category: 'Nutrition', badge: 'MEAL 3' }
    ];

    let HABITS = [];
    let cachedLogs = {};
    let selectedDate = '';
    let trendChartInstance = null;

    function getTodayISO() {
      const now = new Date();
      return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
    }

    function shiftDateISO(isoStr, delta) {
      const [y, m, d] = isoStr.split('-').map(Number);
      const dt = new Date(y, m - 1, d + delta);
      return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
    }

    function loadHabits() {
      try {
        const raw = localStorage.getItem(HABITS_DEF_KEY);
        if (raw) return JSON.parse(raw);
      } catch (e) {}
      return JSON.parse(JSON.stringify(DEFAULT_HABITS));
    }

    function saveHabits(habits) {
      HABITS = habits;
      localStorage.setItem(HABITS_DEF_KEY, JSON.stringify(habits));
    }

    function loadLogs() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return JSON.parse(raw);
      } catch (e) {}
      return {};
    }

    function saveLogs(logs) {
      cachedLogs = logs;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(logs));
    }

    function showToast(msg) {
      const c = document.getElementById('toast-container');
      const t = document.createElement('div');
      t.className = 'toast';
      t.innerHTML = `<i data-lucide="check-circle" style="width:16px;height:16px;"></i> <span>${msg}</span>`;
      c.appendChild(t);
      lucide.createIcons();
      setTimeout(() => t.remove(), 3000);
    }

    function renderAll() {
      cachedLogs = loadLogs();
      if (!selectedDate) selectedDate = getTodayISO();

      document.getElementById('date-picker').value = selectedDate;
      const dayLogs = cachedLogs[selectedDate] || {};

      const container = document.getElementById('habit-checklist-container');
      container.innerHTML = '';

      const categories = ['Movement & Training', 'Supplements & Stack', 'Nutrition'];
      const catIcons = { 'Movement & Training': 'flame', 'Supplements & Stack': 'pill', 'Nutrition': 'utensils' };

      let totalDone = 0;
      const totalCount = HABITS.length;

      categories.forEach(cat => {
        const catHabits = HABITS.filter(h => h.category === cat);
        if (catHabits.length === 0) return;

        const section = document.createElement('div');
        section.className = 'category-section';
        section.innerHTML = `
          <div class="category-header">
            <i data-lucide="${catIcons[cat]}" style="width:14px;height:14px;color:var(--emerald);"></i>
            <span>${cat}</span>
          </div>
          <div class="habits-grid" id="cat-grid-${cat.replace(/\s+/g, '-')}"></div>
        `;
        container.appendChild(section);

        const grid = section.querySelector(`#cat-grid-${cat.replace(/\s+/g, '-')}`);
        catHabits.forEach(h => {
          const isChecked = !!dayLogs[h.id];
          if (isChecked) totalDone++;

          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = `habit-btn ${isChecked ? 'checked' : ''}`;
          btn.innerHTML = `
            <div class="habit-info">
              <div class="checkbox-box">
                <i data-lucide="check" style="width:14px;height:14px;stroke-width:3;"></i>
              </div>
              <span class="habit-label">${h.label}</span>
            </div>
            <span class="habit-badge">${h.badge}</span>
          `;
          btn.addEventListener('click', () => {
            if (!cachedLogs[selectedDate]) cachedLogs[selectedDate] = {};
            cachedLogs[selectedDate][h.id] = !isChecked;
            saveLogs(cachedLogs);
            renderAll();
          });
          grid.appendChild(btn);
        });
      });

      const pct = totalCount > 0 ? Math.round((totalDone / totalCount) * 100) : 0;
      const circumference = 2 * Math.PI * 35;
      const offset = circumference - (pct / 100) * circumference;
      document.getElementById('daily-progress-ring').style.strokeDashoffset = offset;
      document.getElementById('daily-pct-text').textContent = `${pct}%`;
      document.getElementById('daily-fraction-text').innerHTML = `${totalDone} <span style="font-size:13px; font-weight:normal; color:var(--text-muted);">/ ${totalCount}</span>`;
      document.getElementById('daily-progress-bar').style.width = `${pct}%`;

      const gradeBadge = document.getElementById('daily-grade-badge');
      if (pct === 100) {
        gradeBadge.textContent = 'PERFECT';
        gradeBadge.style.background = 'rgba(16, 185, 129, 0.2)';
        gradeBadge.style.color = '#34d399';
      } else if (pct >= 75) {
        gradeBadge.textContent = 'STRONG';
        gradeBadge.style.background = 'rgba(6, 182, 212, 0.2)';
        gradeBadge.style.color = '#22d3ee';
      } else if (pct > 0) {
        gradeBadge.textContent = 'IN PROGRESS';
        gradeBadge.style.background = 'rgba(245, 158, 11, 0.2)';
        gradeBadge.style.color = '#fbbf24';
      } else {
        gradeBadge.textContent = 'PENDING';
        gradeBadge.style.background = '#1e293b';
        gradeBadge.style.color = 'var(--text-muted)';
      }

      checkConsecutiveMisses();
      renderMatrix();
      renderTrendChart();
      lucide.createIcons();
    }

    function checkConsecutiveMisses() {
      const banner = document.getElementById('miss-alert-banner');
      const textEl = document.getElementById('miss-alert-text');
      const today = getTodayISO();
      
      let missedMap = {};
      HABITS.forEach(h => {
        let streak = 0;
        for (let i = 1; i <= 2; i++) {
          const d = shiftDateISO(today, -i);
          const rec = cachedLogs[d] || {};
          if (!rec[h.id]) streak++;
        }
        if (streak >= 2) missedMap[h.label] = 2;
      });

      const missedNames = Object.keys(missedMap);
      if (missedNames.length > 0) {
        banner.classList.remove('hidden');
        textEl.textContent = `You missed ${missedNames.join(', ')} for 2 consecutive days. Get back on protocol!`;
      } else {
        banner.classList.add('hidden');
      }
    }

    function renderMatrix() {
      const grid = document.getElementById('consistency-matrix-grid');
      grid.innerHTML = '';
      const today = getTodayISO();

      for (let i = 13; i >= 0; i--) {
        const d = shiftDateISO(today, -i);
        const rec = cachedLogs[d] || {};
        const count = HABITS.filter(h => rec[h.id]).length;
        const pct = HABITS.length > 0 ? (count / HABITS.length) * 100 : 0;

        let lvl = 'lvl-0';
        if (pct === 100) lvl = 'lvl-3';
        else if (pct >= 70) lvl = 'lvl-2';
        else if (pct > 0) lvl = 'lvl-1';

        const [y, m, day] = d.split('-');
        const cell = document.createElement('div');
        cell.className = `matrix-cell ${lvl}`;
        cell.title = `${d}: ${count}/${HABITS.length} completed`;
        cell.innerHTML = `
          <span class="matrix-date">${m}/${day}</span>
          <span class="matrix-count">${count}</span>
        `;
        cell.addEventListener('click', () => {
          selectedDate = d;
          renderAll();
        });
        grid.appendChild(cell);
      }
    }

    function renderTrendChart() {
      const ctx = document.getElementById('habitTrendChart').getContext('2d');
      const labels = [];
      const data = [];
      const today = getTodayISO();

      for (let i = 13; i >= 0; i--) {
        const d = shiftDateISO(today, -i);
        const [y, m, day] = d.split('-');
        labels.push(`${m}/${day}`);
        const rec = cachedLogs[d] || {};
        const count = HABITS.filter(h => rec[h.id]).length;
        const pct = HABITS.length > 0 ? Math.round((count / HABITS.length) * 100) : 0;
        data.push(pct);
      }

      if (trendChartInstance) trendChartInstance.destroy();

      trendChartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            data: data,
            borderColor: '#10b981',
            backgroundColor: 'rgba(16, 185, 129, 0.15)',
            borderWidth: 2,
            tension: 0.3,
            fill: true,
            pointRadius: 3,
            pointBackgroundColor: '#10b981'
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { grid: { color: 'rgba(255,255,255,0.03)' }, ticks: { color: '#64748b', font: { size: 9 } } },
            y: { min: 0, max: 100, grid: { color: 'rgba(255,255,255,0.03)' }, ticks: { color: '#64748b', font: { size: 9 } } }
          }
        }
      });
    }

    document.getElementById('date-picker').addEventListener('change', (e) => {
      selectedDate = e.target.value;
      renderAll();
    });
    document.getElementById('btn-prev-day').addEventListener('click', () => {
      selectedDate = shiftDateISO(selectedDate, -1);
      renderAll();
    });
    document.getElementById('btn-next-day').addEventListener('click', () => {
      selectedDate = shiftDateISO(selectedDate, 1);
      renderAll();
    });
    document.getElementById('btn-today').addEventListener('click', () => {
      selectedDate = getTodayISO();
      renderAll();
    });
    document.getElementById('btn-mark-all').addEventListener('click', () => {
      if (!cachedLogs[selectedDate]) cachedLogs[selectedDate] = {};
      HABITS.forEach(h => cachedLogs[selectedDate][h.id] = true);
      saveLogs(cachedLogs);
      renderAll();
      showToast('All items completed for this date!');
    });

    document.getElementById('btn-edit-habits').addEventListener('click', () => {
      const listEl = document.getElementById('habit-editor-list');
      listEl.innerHTML = '';
      HABITS.forEach((h, idx) => {
        const row = document.createElement('div');
        row.style.cssText = 'display:flex; gap:8px; align-items:center; background:var(--bg-base); padding:10px; border-radius:10px; border:1px solid var(--border-color);';
        row.innerHTML = `
          <input type="text" value="${h.label}" id="edit-habit-${idx}" style="flex-grow:1; background:var(--bg-card); border:1px solid var(--border-color); border-radius:8px; padding:6px 10px; color:#fff; font-size:12px; outline:none;">
          <button type="button" onclick="updateHabitLabel(${idx})" class="btn btn-primary" style="padding:6px 12px;">Save</button>
        `;
        listEl.appendChild(row);
      });
      document.getElementById('habit-editor-modal').classList.add('active');
    });

    window.updateHabitLabel = function(idx) {
      const val = document.getElementById(`edit-habit-${idx}`).value.trim();
      if (val) {
        HABITS[idx].label = val;
        saveHabits(HABITS);
        renderAll();
        showToast('Habit updated!');
      }
    };

    document.getElementById('close-habit-editor').addEventListener('click', () => {
      document.getElementById('habit-editor-modal').classList.remove('active');
    });
    document.getElementById('btn-close-modal').addEventListener('click', () => {
      document.getElementById('habit-editor-modal').classList.remove('active');
    });
    document.getElementById('btn-restore-defaults').addEventListener('click', () => {
      saveHabits(JSON.parse(JSON.stringify(DEFAULT_HABITS)));
      renderAll();
      showToast('Restored 12 default habits!');
    });

    document.getElementById('btn-export').addEventListener('click', () => {
      const data = { habits: HABITS, logs: cachedLogs };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `daily-protocol-backup-${getTodayISO()}.json`;
      a.click();
    });

    document.getElementById('input-import').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        try {
          const parsed = JSON.parse(evt.target.result);
          if (parsed.logs) saveLogs(parsed.logs);
          if (parsed.habits) saveHabits(parsed.habits);
          renderAll();
          showToast('Data imported successfully!');
        } catch (err) {
          showToast('Invalid backup file.');
        }
      };
      reader.readAsText(file);
    });

    window.onload = () => {
      HABITS = loadHabits();
      cachedLogs = loadLogs();
      selectedDate = getTodayISO();
      renderAll();
    };
  </script>
</body>
</html>
